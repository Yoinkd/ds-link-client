name: Build D.S Link Client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-dslink.yml"
      - "patches/**"
      - "assets/**"

permissions:
  contents: read

env:
  RUSTDESK_TAG: "1.4.9"
  RUSTDESK_COMMIT: "6c578292e8ebbbec708b76986ba8c4bc7c509747"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    name: Generate Flutter bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Check out D.S Link overlay
        uses: actions/checkout@v4

      - name: Fetch pinned RustDesk source
        shell: bash
        run: |
          git clone --branch "$RUSTDESK_TAG" --depth 1 --recurse-submodules --shallow-submodules https://github.com/rustdesk/rustdesk.git rustdesk
          test "$(git -C rustdesk rev-parse HEAD)" = "$RUSTDESK_COMMIT"
          git -C rustdesk apply "$GITHUB_WORKSPACE/patches/dslink-branding.patch"

      - name: Install bridge prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install Flutter for bridge generation
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      - name: Generate bridge files
        working-directory: rustdesk
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge files
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          retention-days: 1
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart
            rustdesk/flutter/macos/Runner/bridge_generated.h
            rustdesk/flutter/ios/Runner/bridge_generated.h

  build-windows:
    name: Build Windows x64 client
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check out D.S Link overlay
        uses: actions/checkout@v4

      - name: Fetch and brand pinned RustDesk source
        shell: pwsh
        run: |
          git clone --branch $env:RUSTDESK_TAG --depth 1 --recurse-submodules --shallow-submodules https://github.com/rustdesk/rustdesk.git rustdesk
          $actual = git -C rustdesk rev-parse HEAD
          if ($actual -ne $env:RUSTDESK_COMMIT) { throw "Unexpected RustDesk commit: $actual" }
          git -C rustdesk apply "$env:GITHUB_WORKSPACE\patches\dslink-branding.patch"
          Copy-Item assets\dslink-taskbar.ico rustdesk\res\icon.ico -Force
          Copy-Item assets\dslink-taskbar.ico rustdesk\res\tray-icon.ico -Force
          Copy-Item assets\dslink-taskbar.ico rustdesk\flutter\assets\icon.ico -Force
          Copy-Item assets\dslink-taskbar.ico rustdesk\flutter\windows\runner\resources\app_icon.ico -Force
          Copy-Item assets\dslink-taskbar-icon.png rustdesk\res\icon.png -Force

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: rustdesk

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install RustDesk native dependencies
        working-directory: rustdesk
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Install RustDesk Flutter engine patch
        working-directory: rustdesk
        shell: bash
        run: |
          flutter doctor -v
          flutter precache --windows
          curl -fL https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -o windows-x64-release.zip
          7z x windows-x64-release.zip -owindows-x64-release
          flutter_root="$(dirname "$(dirname "$(which flutter)")")"
          cp -rf windows-x64-release/* "$flutter_root/bin/cache/artifacts/engine/windows-x64-release/"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$flutter_root/"
          git -C "$flutter_root" apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Build D.S Link
        working-directory: rustdesk
        shell: pwsh
        run: python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram

      - name: Build session-window helper
        shell: pwsh
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow.git topmost
          git -C topmost checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild topmost\WindowInjection\WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Package unsigned client
        shell: pwsh
        run: |
          $package = "dist\DSLink-Client-1.4.9-unsigned"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item "rustdesk\flutter\build\windows\x64\runner\Release\*" $package -Recurse -Force
          if (Test-Path "$package\rustdesk.exe") {
            Rename-Item "$package\rustdesk.exe" "DSLink.exe"
          } else {
            throw "The compiled rustdesk.exe was not found."
          }
          Copy-Item "topmost\WindowInjection\x64\Release\WindowInjection.dll" $package -Force
          Copy-Item "LICENSE-NOTICE.md" "$package\SOURCE-NOTICE.txt" -Force

      - name: Upload D.S Link client
        uses: actions/upload-artifact@v4
        with:
          name: DSLink-Client-1.4.9-unsigned
          retention-days: 30
          if-no-files-found: error
          path: dist/DSLink-Client-1.4.9-unsigned/

